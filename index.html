<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#16212A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas abajo; la cifra del patrimonio manda en Inicio */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#16212A; --muted:#5B6B72; --line:#D9E1DD; --soft:#E4EBE7;
  --bar:#16212A; --bar-ink:#E6ECE9; --bar-muted:#8D9CA1;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D5ECE8;
  --ok:#1D7A4C; --ok-soft:#DDF0E4; --warn:#A95F12; --warn-soft:#F7E8D3; --bad:#BC3328; --bad-soft:#F7DEDA;
  --info:#2E65A0; --info-soft:#DCE8F5;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#162025; --ink:#E6ECE9; --muted:#93A3A8; --line:#25333A; --soft:#1D2A30;
  --bar:#0A0F11; --bar-ink:#E6ECE9; --bar-muted:#7E8E93;
  --accent:#4DB6AC; --accent-ink:#0B1A19; --accent-soft:#17383A;
  --ok:#5BC48B; --ok-soft:#173327; --warn:#E3A04F; --warn-soft:#3A2B17; --bad:#EF7A6E; --bad-soft:#3D1F1C;
  --info:#7FB0E6; --info-soft:#1B2D42;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#162025; --ink:#E6ECE9; --muted:#93A3A8; --line:#25333A; --soft:#1D2A30;
  --bar:#0A0F11; --bar-ink:#E6ECE9; --bar-muted:#7E8E93;
  --accent:#4DB6AC; --accent-ink:#0B1A19; --accent-soft:#17383A;
  --ok:#5BC48B; --ok-soft:#173327; --warn:#E3A04F; --warn-soft:#3A2B17; --bad:#EF7A6E; --bad-soft:#3D1F1C;
  --info:#7FB0E6; --info-soft:#1B2D42;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(84px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-size:26px;margin:6px 0 0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.estado{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding-block:6px}
.vivo{display:inline-flex;align-items:center;gap:6px}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.vivo.on i{background:var(--ok);animation:latido 2s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(29,122,76,.5)}70%{box-shadow:0 0 0 7px rgba(29,122,76,0)}100%{box-shadow:0 0 0 0 rgba(29,122,76,0)}}
@media (prefers-reduced-motion:reduce){.vivo.on i{animation:none}}
.hero{padding-block:10px 4px;display:grid;gap:6px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,58px);line-height:1;letter-spacing:-.03em}
.chip{display:inline-flex;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;width:max-content}
.chip.up{background:var(--ok-soft);color:var(--ok)} .chip.down{background:var(--bad-soft);color:var(--bad)} .chip.flat{background:var(--soft);color:var(--muted)}
.split{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
section{padding-block:18px 0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:9px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--bad)} .bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.info{background:var(--info)}
.bar-wrap{position:relative;padding-block:3px}
.pace{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.grp{display:grid;gap:5px}
.grp-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.total{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:0 0 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.tbl tr.t td{font-weight:700}
.pill{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok,.pill.camino{background:var(--ok-soft);color:var(--ok)} .pill.aviso{background:var(--warn-soft);color:var(--warn)}
.pill.mal{background:var(--bad-soft);color:var(--bad)} .pill.curso{background:var(--info-soft);color:var(--info)}
.goal{display:grid;gap:7px;padding-block:12px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:0}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.goal-foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.stack span{display:block;height:100%}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:3px}
.pos-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:10px;border-top:1px solid var(--line)}
.pos-f:first-child{border-top:0;padding-top:0}
.pos-f .n{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-f .s{font-size:12.5px;color:var(--muted)}
.pos-f .s.pos,.pos-f .s .pos{color:var(--ok)} .pos-f .s.neg,.pos-f .s .neg{color:var(--bad)}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;font-size:13.5px}
.alert::before{content:"";border-radius:4px;background:var(--warn)}
.grafica{width:100%;height:auto;display:block}
.g-grid{stroke:var(--line)} .g-eje{fill:var(--muted);font-size:10px;font-family:var(--body)}
/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);display:flex;justify-content:space-around;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--bar-muted);padding:4px 4px;border-radius:10px;min-width:54px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--bar-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
/* pantalla de acceso */
.acceso{min-height:80vh;display:grid;align-content:center;gap:16px;padding-block:40px}
.acceso .logo{width:64px;height:64px;border-radius:16px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:13px 16px;border-radius:12px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:13.5px}
/* acciones desde el móvil */
.sec-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.mini.sec{background:var(--soft);color:var(--ink)}
.mini:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lapiz{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:30px;height:30px;margin:-6px -6px -6px 6px;vertical-align:middle;border-radius:50%;color:var(--accent)}
.lapiz svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.lapiz:active{background:var(--accent-soft)}
.rapidas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rapidas button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:2px;font-weight:600;font-size:14.5px}
.rapidas button span{font-weight:400;font-size:12.5px;color:var(--muted)}
.rapidas button.ancha{grid-column:1/-1;grid-template-columns:auto 1fr;align-items:center;gap:12px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rapidas button.ancha b{display:grid;gap:2px;font-weight:600}
.rapidas button.ancha b span{color:var(--accent-ink);opacity:.8}
.rapidas .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);color:var(--accent-ink)}
.rapidas .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=file]{padding:10px;font-size:14px}
.hoja .nota{font-size:13px;color:var(--muted);margin:0}
.espera{background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:6px;font-size:13.5px;margin-top:6px}
.espera b{color:var(--warn)}
.pill.esp{background:var(--warn-soft);color:var(--warn)}
.hoja-fondo{position:fixed;inset:0;z-index:30;background:rgba(10,15,17,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.hoja-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hoja .x{all:unset;cursor:pointer;font-size:18px;color:var(--muted);padding:4px 8px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.toast-m{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast-m.mal{background:var(--bad);color:#fff}
/* gráficas de evolución interactivas */
.gx{display:grid;gap:8px;min-width:0}
.gx-ctrl{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap}
.gx-lectura{display:grid;gap:2px;align-content:start;min-width:0}
.gx-fecha{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gx-vals{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.gx-vals b{font-size:16px}
.gx-vals i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.gx-vals em{font-style:normal;font-size:12.5px;color:var(--muted)}
.gx-vals em.bien{color:var(--ok)} .gx-vals em.mal{color:var(--bad)}
.gx-rangos{margin-left:auto;display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.gx-rangos button,.gx-ley button{font:inherit;cursor:pointer;border:0;background:none;color:var(--muted)}
.gx-rangos button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.gx-rangos button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gx-ley{display:flex;flex-wrap:wrap;gap:5px}
.gx-ley button{font-size:12px;padding:3px 9px 3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.gx-ley button i{width:12px;height:4px;border-radius:2px;display:inline-block}
.gx-ley button[aria-pressed="false"]{opacity:.5;border-style:dashed}
.gx-rangos button:focus-visible,.gx-ley button:focus-visible,.gx-svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gx-svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair;border-radius:6px}
.gx-grid{stroke:var(--line);stroke-width:1}
.gx-eje{fill:var(--muted);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.gx-cruz{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
.gx-ref{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:6 4;opacity:.6}
.gx-ref-t{fill:var(--ink);opacity:.75;font-weight:600}
.gx-barra{transition:opacity .15s}
.gx-barra.apagada{opacity:.4}
.gx-vacio{color:var(--muted);font-size:13.5px;margin:0}
.gx-pista{font-size:12.5px;color:var(--muted);padding-top:2px}

@keyframes gx-traza{from{stroke-dashoffset:var(--l)}to{stroke-dashoffset:0}}
@keyframes gx-aparece{from{opacity:0}to{opacity:1}}
@keyframes gx-crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gx-traza{stroke-dasharray:var(--l);animation:gx-traza .9s ease-out both}
.gx-aparece{animation:gx-aparece .9s ease-out both}
.gx-crece{animation:gx-crece .5s ease-out both}
@media (prefers-reduced-motion:reduce){.gx-traza,.gx-aparece,.gx-crece{animation:none}}
/* calculadoras */
.cx{display:grid;gap:14px}
.cx-tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;justify-self:start}
.cx-tabs button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.cx-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cx-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:760px){.cx-grid{grid-template-columns:1fr}}
.cx-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 12px;align-items:start}
@media (max-width:330px){.cx-form{grid-template-columns:1fr}}
@media (max-width:480px){.cx-campo small{display:none}.cx-in input{padding:8px 8px}.cx-in i{padding:0 8px}}
.cx-campo{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0;align-content:start}
.cx-campo small{font-size:11.5px;font-weight:400;line-height:1.35}
.cx-in{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cx-in:focus-within{outline:2px solid var(--accent);border-color:var(--accent)}
.cx-in input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:9px 10px;font-variant-numeric:tabular-nums;outline:none}
.cx-in i{font-style:normal;color:var(--muted);padding:0 10px;font-size:13px}
.cx-res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px;min-width:0}
.cx-cabeza{display:grid;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cx-cabeza>span:first-child,.cx-max>span:first-child{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cx-big{font-family:var(--display,inherit);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.cx-big2{font-family:var(--display,inherit);font-weight:700;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cx-sub{font-size:12.5px;color:var(--muted)}
.cx-pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;width:max-content}
.cx-pill.ok{background:var(--ok-soft);color:var(--ok)} .cx-pill.aviso{background:var(--warn-soft);color:var(--warn)} .cx-pill.mal{background:var(--bad-soft);color:var(--bad)}
.cx-fila{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.cx-fila b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-fila b.ok{color:var(--ok)} .cx-fila b.aviso{color:var(--warn)} .cx-fila b.mal{color:var(--bad)}
.cx-txt{font-size:13.5px;margin:8px 0 0;line-height:1.45} .cx-txt.mal{color:var(--bad)}
.cx-max{margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:3px}
.cx-graf{margin-top:12px}
.cx-nota{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
/* análisis */
.ia-prev{display:grid;gap:8px}
.ia-rango{position:relative;height:12px;border-radius:99px;background:var(--soft)}
.ia-rango i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--info-soft);border:1px solid var(--info)}
.ia-rango b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--info)}
.ia-rango s{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.6;text-decoration:none}
.ia-escala{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ia-aviso{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;font-size:13.5px;padding:6px 0;line-height:1.45}
.ia-aviso::before{content:"";border-radius:4px;background:var(--warn)}
.ia-aviso.mal::before{background:var(--bad)} .ia-aviso.ok::before{background:var(--ok)}
.ia-cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ia-cat:first-child{border-top:0}
.ia-barra{grid-column:1/-1;position:relative;height:6px;border-radius:99px;background:var(--soft)}
.ia-barra i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c1)}
.ia-barra i.mal{background:var(--bad)}
.ia-barra s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.ia-top{display:grid;gap:2px}
.ia-eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ia-cifra{font-family:var(--display,inherit);font-weight:700;font-size:28px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ia-pill{font-family:var(--body,inherit);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:0}
.ia-pill.ok{background:var(--ok-soft);color:var(--ok)} .ia-pill.mal{background:var(--bad-soft);color:var(--bad)}
.ia-txt{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.ia-vacio{font-size:13.5px;color:var(--muted);margin:0}
.ia-num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ia-muted{color:var(--muted);font-size:12.5px}
.ia-mal{color:var(--bad);font-weight:600}
.ia-tabla{display:grid}
.ia-fila{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:4px 14px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ia-fila:first-child{border-top:0}
.ia-cab span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="acceso"><p class="muted">Cargando…</p></div></div>
<nav class="tabs" id="tabs" hidden aria-label="Secciones">
  <button data-t="inicio" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
  <button data-t="cartera"><svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>Cartera</button>
  <button data-t="objetivos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg>Objetivos</button>
  <button data-t="planificar"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></svg>Planificar</button>
  <button data-t="cuentas"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Cuentas</button>
</nav>

<script>
(function(){
  'use strict';
  // Servidor de sincronización (clave pública: solo permite llamar a las dos funciones de la base de datos)
  const SERVIDOR='https://scymqnqxivijudkzajkj.supabase.co';
  const PUBLICA='sb_publishable_QWuDZy-chNZvtspmeOMXLg_1ARFAikx';
  const ITER=250000;
  const $=s=>document.querySelector(s);
  const app=$('#app');
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const SERIE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];
  let D=null, version=0, pestana='inicio', clave=null, codigo=null, ultimaSync=null, errorRed=false;

  // ---------- almacenamiento local (puede fallar en modo privado: se tolera)
  const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}, del:k=>{try{localStorage.removeItem(k);}catch(e){}}};

  // ---------- formato
  const grupo=n=>n.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  function eur(v,dec){ if(v==null||isNaN(v)) return '—'; v=Number(v); const d=dec===undefined?(Math.abs(v)<100&&v%1!==0?2:0):dec; const s=Math.abs(v).toFixed(d).split('.'); return (v<0?'−':'')+grupo(s[0])+(d?','+s[1]:'')+' €'; }
  const pct=(v,d)=>v==null?'—':(v*100).toFixed(d===undefined?1:d).replace('.',',')+' %';
  function mesTxt(ym,corto){ if(!ym) return ''; const [y,m]=ym.slice(0,7).split('-').map(Number); return corto?MES3[m-1]+' '+String(y).slice(2):MESES[m-1]+' '+y; }
  function fecha(iso){ if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-').map(Number); return d+' '+MES3[m-1]; }
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function hace(iso){ if(!iso) return ''; const s=(Date.now()-new Date(iso))/1000; if(s<60) return 'ahora mismo'; if(s<3600) return 'hace '+Math.round(s/60)+' min'; if(s<86400) return 'hace '+Math.round(s/3600)+' h'; return 'el '+fecha(iso); }

  // ---------- cifrado (mismo esquema que el programa: PBKDF2-SHA256 → AES-256-GCM)
  const b64a=b=>{ let s=''; new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
  const ab64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function derivar(pass,cod){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('misfinanzas:'+cod),iterations:ITER},base,256));
  }
  async function descifrar(raw,texto){
    const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']); const b=ab64(texto);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12))));
  }
  async function pedir(ver){
    const r=await fetch(SERVIDOR+'/rest/v1/rpc/leer_resumen',{method:'POST',headers:{'apikey':PUBLICA,'Content-Type':'application/json'},body:JSON.stringify({p_id:codigo,p_version:ver})});
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  }

  // ---------- arranque y acceso
  // el código viaja en el enlace del QR; se copia también a ?c= porque la app de la pantalla de inicio
  // se abre con la dirección guardada y no comparte memoria con Safari
  const valido=c=>/^[0-9a-f]{32,64}$/.test(c||'');
  function extraer(txt){ const m=String(txt||'').match(/[0-9a-f]{40}/); return m?m[0]:null; }
  function leerCodigo(){
    const q=new URLSearchParams(location.search).get('c'), h=location.hash.replace('#','').trim();
    const c=valido(h)?h:valido(q)?q:ls.get('mf_codigo');
    if(valido(c)){ ls.set('mf_codigo',c); if(q!==c||h!==c) history.replaceState(null,'',location.pathname+'?c='+c+'#'+c); return c; }
    return null; }
  async function arrancar(){
    codigo=leerCodigo();
    if(!codigo){ pantallaSinCodigo(); return; }
    const k=ls.get('mf_clave_'+codigo); if(k) clave=ab64(k);
    const cache=ls.get('mf_cache_'+codigo);
    cargarPend();
    if(clave&&cache){ try{ const c=JSON.parse(cache); D=await descifrar(clave,c.datos); version=c.version; ultimaSync=c.actualizado; revisarAplicados(); pintar(); }catch(e){} }
    if(!clave){ pantallaAcceso(); return; }
    await sincronizar(); setInterval(()=>{ if(!document.hidden) sincronizar(); },5000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sincronizar(); });
  }
  async function sincronizar(){
    try{ const filas=await pedir(version); errorRed=false;
      if(filas.length){ const f=filas[0]; D=await descifrar(clave,f.datos); version=f.version; ultimaSync=f.actualizado;
        ls.set('mf_cache_'+codigo,JSON.stringify({datos:f.datos,version:f.version,actualizado:f.actualizado})); revisarAplicados();
        const foco=document.activeElement; if(!(foco&&foco.closest&&foco.closest('#app')&&/INPUT|SELECT/.test(foco.tagName))) pintar(); else estado(); }
      if(pend.some(p=>!p.enviado)) enviarPend().then(()=>{ if(D) pintar(); });
      else if(!D){ app.innerHTML=`<div class="acceso"><h1>Mis Finanzas</h1><p class="muted">Todavía no hay datos. Abre el programa en tu ordenador para que se envíen.</p></div>`; }
      else estado(); }
    catch(e){ errorRed=true; if(D) estado(); else if(e.name==='OperationError') pantallaAcceso('La contraseña no es correcta.'); }
  }
  function pantallaSinCodigo(){
    app.innerHTML=`<div class="acceso"><img class="logo" src="icon-192.png" alt=""><h1>Mis Finanzas</h1>
      <p class="muted">Para conectar este móvil, abre en el programa de tu ordenador la sección <b>Tu móvil</b> y escanea el código QR con la cámara del iPhone.</p>
      <p class="muted small">¿Ya lo escaneaste y has abierto la app desde la pantalla de inicio? Pega aquí el enlace del QR (en el programa: «Copiar enlace»):</p>
      <form id="f-enl" style="display:grid;gap:10px"><input id="enl" placeholder="https://…/#…" autocomplete="off" autocapitalize="off"><button class="btn" type="submit">Conectar</button></form></div>`;
    $('#f-enl').onsubmit=e=>{ e.preventDefault(); const c=extraer($('#enl').value); if(!c){ $('#enl').value=''; $('#enl').placeholder='Ese enlace no es válido'; return; }
      location.replace(location.pathname+'?c='+c+'#'+c); };
  }
  function pantallaAcceso(error){
    app.innerHTML=`<form class="acceso" id="f-acc"><img class="logo" src="icon-192.png" alt=""><h1>Mis Finanzas</h1>
      <p class="muted">Escribe la contraseña del móvil que elegiste en el programa. Solo se pide una vez en este teléfono.</p>
      <label>Contraseña<input id="pass" type="password" autocomplete="current-password" required></label>
      ${error?`<p class="err">${esc(error)}</p>`:''}<button class="btn" type="submit" id="entrar">Entrar</button></form>`;
    $('#f-acc').onsubmit=async e=>{ e.preventDefault(); const b=$('#entrar'); b.textContent='Comprobando…';
      try{ const raw=await derivar($('#pass').value,codigo); const filas=await pedir(0);
        if(!filas.length){ pantallaAcceso('Todavía no hay datos de tu ordenador. Ábrelo y vuelve a intentarlo.'); return; }
        D=await descifrar(raw,filas[0].datos); clave=raw; ls.set('mf_clave_'+codigo,b64a(raw)); version=filas[0].version; ultimaSync=filas[0].actualizado;
        ls.set('mf_cache_'+codigo,JSON.stringify({datos:filas[0].datos,version,actualizado:ultimaSync})); cargarPend(); pintar();
        setInterval(()=>{ if(!document.hidden) sincronizar(); },5000); }
      catch(err){ pantallaAcceso(err.name==='OperationError'?'La contraseña no es correcta.':'No hay conexión. Inténtalo de nuevo.'); } };
  }

  // ---------- pestañas
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ pestana=b.dataset.t; pintar(); scrollTo(0,0); });
  function estado(){ const e=$('#estado'); if(!e) return; const v=vivo(), abierto=v&&Object.values(v.precios||{}).some(p=>p.abierto);
    e.innerHTML=`<span>${errorRed?'Sin conexión · ':''}Actualizado ${hace(ultimaSync)}</span>${v?`<span class="vivo ${abierto?'on':''}"><i></i>${abierto?'Bolsa abierta':'Bolsa cerrada'}</span>`:''}`; }
  function pintar(){
    $('#tabs').hidden=false;
    document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===pestana?'page':'false'));
    app.innerHTML=`<div class="estado" id="estado"></div>`+vEspera()+({inicio:vInicio,cartera:vCartera,objetivos:vObjetivos,planificar:vPlanificar,cuentas:vCuentas}[pestana])();
    estado();
    if(pestana==='planificar'&&subPlan==='calc'){ const r=$('#sim-m'); if(r) CALC.bind(r,D,(el,spec)=>{ el.innerHTML=GX.crear('m-amort',Object.assign({tipo:'linea',alto:170,sinRangos:true,ultimoEsHoy:false,sinDelta:true,etiqueta:ym=>ym.slice(0,4)},spec)); }); }
  }

  // ---------- precios en vivo (los manda el ordenador mientras el programa está abierto)
  // vale solo si es reciente (el programa está abierto); si no, se usan los precios del último cálculo
  function vivo(){ const v=D.vivo; return v&&v.generado&&(Date.now()-new Date(v.generado))<15*60e3?v:null; }
  function valorCartera(){ const v=D.vivo; if(!v||!v.precios) return D.cartera.valor;
    return (D.cartera.posiciones||[]).reduce((a,p)=>a+(v.precios[p.isin]?v.precios[p.isin].valor:p.valor),0); }
  function netoVivo(){ return D.patrimonio.neto+(valorCartera()-D.cartera.valor); }

  // ================= GRÁFICAS DE EVOLUCIÓN INTERACTIVAS =================
  // Arrastra el dedo (o mueve el ratón) por la gráfica para ver cada mes; elige el periodo y pulsa la leyenda
  // para mostrar u ocultar líneas. Las flechas del teclado también mueven la selección.
  const GX=(()=>{
    const MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const ML=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const RANGOS=[['6M',6],['1A',12],['2A',24],['Todo',1e9]];
    const specs={}, est={};
    const g3=n=>n.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const euro=(v,d)=>{ if(v==null||isNaN(v)) return '—'; const s=Math.abs(v).toFixed(d||0).split('.'); return (v<0?'−':'')+g3(s[0])+(d?','+s[1]:'')+' €'; };
    const corto=v=>{ const a=Math.abs(v); return (v<0?'−':'')+(a>=10000?g3(String(Math.round(a/1000)))+' mil':g3(String(Math.round(a))))+' €'; };
    const etq=(ym,largo)=>{ const [y,m]=ym.split('-').map(Number); return largo?ML[m-1]+' '+y:MC[m-1]+(m===1?' '+String(y).slice(2):''); };
    const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function ticks(min,max,n){ if(min===max){min-=1;max+=1;} const p0=(max-min)/n, m=Math.pow(10,Math.floor(Math.log10(p0))), r=p0/m;
      const p=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*m, o=[]; for(let v=Math.floor(min/p)*p;;v+=p){ o.push(+v.toFixed(10)); if(v>=max-p*1e-9||o.length>40) break; } return o; }

    // spec: {tipo:'linea'|'barras', etiquetas:['2026-01',…], series:[{nombre,color,valores,area,discontinua}],
    //        alto, rango:'1A', ocultas:[nombres], referencia:{valor,nombre}, colorBarra:(v,i)=>color, ultimoEsHoy:true}
    function crear(id,spec){
      specs[id]=spec;
      if(!est[id]){ let g=null; try{ g=JSON.parse(localStorage.getItem('gx_'+id)||'null'); }catch(e){}  // lo que elegiste la última vez
        const validas=new Set(spec.series.map(z=>z.nombre));
        est[id]={rango:(g&&g.rango)||spec.rango||'1A', ocultas:new Set(g&&g.ocultas?g.ocultas.filter(n=>validas.has(n)):(spec.ocultas||[])), animada:false}; }
      est[id].sel=null;
      setTimeout(()=>dibujar(id),0);
      return `<div class="gx" id="${id}"><div class="gx-hueco" style="height:${(spec.alto||220)+70}px"></div></div>`;
    }
    function visibles(id){ const s=specs[id], st=est[id]; return s.series.filter(x=>!st.ocultas.has(x.nombre)); }
    function tramo(id){ const s=specs[id], st=est[id], N=s.etiquetas.length; if(s.sinRangos) return [0,N];
      const n=RANGOS.find(r=>r[0]===st.rango)[1]+(s.tipo==='barras'?0:1); return [Math.max(0,N-n),N]; }
    function dibujar(id){
      const el=document.getElementById(id); if(!el) return;
      const s=specs[id], st=est[id], N=s.etiquetas.length;
      if(!N){ el.innerHTML='<p class="gx-vacio">Aún no hay datos suficientes.</p>'; return; }
      const [a,b]=tramo(id), et=s.etiquetas.slice(a,b), n=et.length, ser=visibles(id);
      const W=Math.max(260,Math.round(el.clientWidth||600)), H=s.alto||220, estrecho=W<480;
      const T=10, B=24, Rm=estrecho?6:10;
      const vals=ser.flatMap(x=>x.valores.slice(a,b)).filter(v=>v!=null).concat(s.referencia?[s.referencia.valor]:[]);
      let mn=Math.min(...vals,s.tipo==='barras'?0:Infinity), mx=Math.max(...vals);
      if(!isFinite(mn)){ mn=0; mx=1; }
      const pad=(mx-mn)*0.08||Math.abs(mx)*0.1||1; if(s.tipo!=='barras'){ mn=mn>0&&mn>0.4*mx?mn-pad:Math.min(mn,0); } mx+=pad;
      const tk=ticks(mn,mx,estrecho?3:4); mn=tk[0]; mx=tk[tk.length-1];
      const L=Math.max(...tk.map(v=>corto(v).length))*6.2+10;
      const banda=(W-L-Rm)/n;
      const x=s.tipo==='barras'?(i=>L+banda*(i+0.5)):(i=>L+(n<2?(W-L-Rm)/2:i*(W-L-Rm)/(n-1)));
      const y=v=>T+(1-(v-mn)/(mx-mn||1))*(H-T-B);
      const grid=tk.map(v=>`<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" class="gx-grid"/><text x="${L-8}" y="${y(v)+4}" class="gx-eje" text-anchor="end">${corto(v)}</text>`).join('');
      const cada=Math.max(1,Math.ceil(n/(estrecho?5:9)));
      const ejeX=et.map((e,i)=>{ const ult=i===n-1; if(!(ult||(i%cada===0&&n-1-i>=cada*0.6))) return '';
        const t=ult&&s.ultimoEsHoy!==false?'hoy':(s.etiqueta||etq)(e); const anc=s.tipo==='barras'?'middle':i===0?'start':ult?'end':'middle';
        return `<text x="${x(i)}" y="${H-6}" class="gx-eje" text-anchor="${anc}">${t}</text>`; }).join('');
      let cuerpo='';
      if(s.tipo==='barras'){
        const v0=ser[0]?ser[0].valores.slice(a,b):[], aB=Math.max(3,Math.min(30,banda*0.64));
        cuerpo=v0.map((v,i)=>{ v=v||0; const h=Math.max(0,y(0)-y(Math.max(v,0))), r=Math.min(4,h/2,aB/2), x0=x(i)-aB/2;
          return `<path class="gx-barra" data-i="${i}" d="M${x0},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${aB-2*r} q${r},0 ${r},${r} v${h-r} Z" fill="${s.colorBarra?s.colorBarra(v,a+i):ser[0].color}"/>`; }).join('');
      } else {
        cuerpo=ser.map((z,k)=>{ const pts=z.valores.slice(a,b).map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean); if(!pts.length) return '';
          const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L'), base=y(Math.max(mn,0));
          const gid=id+'-gr'+k, ult=pts[pts.length-1];
          const area=z.area?`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${z.color}" stop-opacity=".22"/><stop offset="1" stop-color="${z.color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${ult[0]},${base} L${pts[0][0]},${base} Z" fill="url(#${gid})" class="gx-area"/>`:'';
          return `${area}<path d="${d}" fill="none" stroke="${z.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" class="gx-linea" ${z.discontinua?'stroke-dasharray="5 4"':''}/><circle cx="${ult[0]}" cy="${ult[1]}" r="4" fill="${z.color}" stroke="var(--surface)" stroke-width="2"/>`; }).join('');
      }
      const ref=s.referencia?`<line x1="${L}" x2="${W-Rm}" y1="${y(s.referencia.valor)}" y2="${y(s.referencia.valor)}" class="gx-ref"/><text x="${W-Rm}" y="${y(s.referencia.valor)-6}" class="gx-eje gx-ref-t" text-anchor="end">${escH(s.referencia.nombre)} ${corto(s.referencia.valor)}</text>`:'';
      const puntos=s.tipo==='barras'?'':ser.map(z=>`<circle r="5.5" fill="${z.color}" stroke="var(--surface)" stroke-width="2.5" class="gx-punto" data-n="${escH(z.nombre)}" style="display:none"/>`).join('');
      const rangos=N>7&&!s.sinRangos?`<div class="gx-rangos" role="group" aria-label="Periodo">${RANGOS.filter(r=>r[1]<1e9?N>r[1]-(r[0]==='6M'?0:4):true).map(r=>`<button type="button" data-r="${r[0]}" aria-pressed="${st.rango===r[0]}">${r[0]}</button>`).join('')}</div>`:'';
      const ley=s.series.length>1?`<div class="gx-ley">${s.series.map(z=>`<button type="button" data-s="${escH(z.nombre)}" aria-pressed="${!st.ocultas.has(z.nombre)}"><i style="background:${z.color}${z.discontinua?';background:repeating-linear-gradient(90deg,'+z.color+' 0 4px,transparent 4px 6px)':''}"></i>${escH(z.nombre)}</button>`).join('')}</div>`:'';
      el.innerHTML=`${rangos||ley?`<div class="gx-ctrl">${ley||'<span></span>'}${rangos}</div>`:''}<div class="gx-lectura" aria-live="polite" style="min-height:${s.pista&&ser.length===1?24:18+22*Math.ceil(ser.length/(estrecho?1:2))}px"></div>
        <svg class="gx-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img" aria-label="${escH(ser.map(z=>z.nombre).join(', '))}: arrastra o usa las flechas para ver cada mes">
          ${grid}${ref}<line class="gx-cruz" y1="${T}" y2="${H-B}" style="display:none"/>${cuerpo}${puntos}${ejeX}
          <rect class="gx-zona" x="${L}" y="0" width="${W-L-Rm}" height="${H}" fill="transparent"/></svg>`;
      const svg=el.querySelector('svg');
      // animación de entrada (solo la primera vez y si el sistema no pide menos movimiento)
      if(!st.animada&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        svg.querySelectorAll('.gx-linea:not([stroke-dasharray])').forEach(p=>{ p.style.setProperty('--l',Math.ceil(p.getTotalLength())); p.classList.add('gx-traza'); });
        svg.querySelectorAll('.gx-area').forEach(p=>p.classList.add('gx-aparece'));
        svg.querySelectorAll('.gx-barra').forEach((p,i)=>{ p.style.transformOrigin=`0 ${y(0)}px`; p.style.animationDelay=Math.min(i*20,400)+'ms'; p.classList.add('gx-crece'); });
        st.animada=true;
      }
      const geo={a,n,x,y,L,W,Rm,banda,ser};
      const indice=cx=>{ const r=svg.getBoundingClientRect(), px=(cx-r.left)*W/r.width;
        return s.tipo==='barras'?Math.max(0,Math.min(n-1,Math.floor((px-L)/banda))):Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-Rm)/Math.max(1,n-1))))); };
      const mover=e=>{ seleccionar(id,geo,indice(e.clientX)); };
      svg.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') svg.setPointerCapture(e.pointerId); mover(e); });
      svg.addEventListener('pointermove',mover);
      svg.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') seleccionar(id,geo,null); });
      svg.addEventListener('pointerup',e=>{ if(e.pointerType!=='mouse') setTimeout(()=>seleccionar(id,geo,null),2500); });
      svg.addEventListener('keydown',e=>{ if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault();
        const i=st.sel==null?n-1:st.sel+(e.key==='ArrowLeft'?-1:1); seleccionar(id,geo,Math.max(0,Math.min(n-1,i))); });
      svg.addEventListener('blur',()=>seleccionar(id,geo,null));
      const recordar=()=>{ try{ localStorage.setItem('gx_'+id,JSON.stringify({rango:st.rango,ocultas:[...st.ocultas]})); }catch(e){} };
      el.querySelectorAll('[data-r]').forEach(bt=>bt.onclick=()=>{ st.rango=bt.dataset.r; recordar(); dibujar(id); });
      el.querySelectorAll('[data-s]').forEach(bt=>bt.onclick=()=>{ const nm=bt.dataset.s;
        if(st.ocultas.has(nm)) st.ocultas.delete(nm); else if(visibles(id).length>1) st.ocultas.add(nm); recordar(); dibujar(id); });
      seleccionar(id,geo,null);
    }
    // muestra los valores del mes elegido (o del último si no hay ninguno elegido)
    function seleccionar(id,g,i){
      const el=document.getElementById(id); if(!el) return; const s=specs[id], st=est[id], svg=el.querySelector('svg');
      st.sel=i; const k=i==null?(s.inicial!=null&&s.inicial>=g.a&&s.inicial<g.a+g.n?s.inicial-g.a:g.n-1):i, abs=g.a+k, cruz=svg.querySelector('.gx-cruz');
      const pista=s.pista&&g.ser.length===1;
      if(i==null&&pista){ el.querySelector('.gx-lectura').innerHTML=`<span class="gx-pista">${matchMedia('(pointer:coarse)').matches?'Desliza el dedo':'Mueve el ratón'} por la gráfica para ver cada mes</span>`; }
      if(i==null){ cruz.style.display='none'; svg.querySelectorAll('.gx-punto').forEach(p=>p.style.display='none'); svg.querySelectorAll('.gx-barra').forEach(p=>p.classList.remove('apagada')); }
      else { cruz.setAttribute('x1',g.x(k)); cruz.setAttribute('x2',g.x(k)); cruz.style.display='';
        svg.querySelectorAll('.gx-punto').forEach(p=>{ const z=g.ser.find(z=>z.nombre===p.dataset.n), v=z&&z.valores[abs];
          if(v==null){ p.style.display='none'; return; } p.setAttribute('cx',g.x(k)); p.setAttribute('cy',g.y(v)); p.style.display=''; });
        svg.querySelectorAll('.gx-barra').forEach(p=>p.classList.toggle('apagada',+p.dataset.i!==k)); }
      const ult=abs===s.etiquetas.length-1;
      const fecha=ult&&s.ultimoEsHoy!==false?(s.tipo==='barras'?etq(s.etiquetas[abs],true)+' (en curso)':'Hoy'):(s.etiqueta||etq)(s.etiquetas[abs],true);
      const filas=g.ser.map(z=>{ const v=z.valores[abs]; if(v==null) return '';
        const p=abs>0?z.valores[abs-1]:null, dif=p==null?null:v-p;
        let extra='';
        if(s.tipo==='barras'&&s.referencia){ const d=v-s.referencia.valor; extra=`<em class="${d>0?'mal':'bien'}">${d>0?euro(d)+' por encima':euro(-d)+' por debajo'}</em>`; }
        else if(dif!=null&&s.tipo!=='barras'&&!s.sinDelta){ extra=`<em class="${Math.abs(dif)<0.5?'':dif>0?'bien':'mal'}" title="respecto al mes anterior">${dif>0?'+':''}${euro(dif)}${g.W<480?'':' vs mes anterior'}</em>`; }
        return `<span>${g.ser.length>1?`<i style="background:${z.color}"></i>`:''}${g.ser.length>1?escH(z.nombre)+' ':''}<b>${euro(v)}</b> ${extra}</span>`; }).join('');
      if(i==null&&pista) return;
      el.querySelector('.gx-lectura').innerHTML=`<span class="gx-fecha">${escH(fecha.replace(/^\w/,c=>c.toUpperCase()))}</span><div class="gx-vals">${filas}</div>`;
    }
    let tRes=null;
    window.addEventListener('resize',()=>{ clearTimeout(tRes); tRes=setTimeout(()=>Object.keys(specs).forEach(id=>{ if(document.getElementById(id)) dibujar(id); }),150); });
    return {crear};
  })();

  // ================= CALCULADORAS «¿ME LO PUEDO PERMITIR?» =================
  // Vivienda (hipoteca), coche y préstamo. Se rellenan con tus datos reales (ingreso medio, ahorro, cuotas,
  // gasolina) y se recalculan al escribir. Reglas habituales de la banca en España; es orientativo.
  const CALC=(()=>{
    const g3=n=>n.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const euro=(v,d)=>{ if(v==null||!isFinite(v)) return '—'; const s=Math.abs(v).toFixed(d||0).split('.'); return (v<0?'−':'')+g3(s[0])+(d?','+s[1]:'')+' €'; };
    const pc=v=>isFinite(v)?(v*100).toFixed(1).replace('.',',')+' %':'—';
    const num=v=>{ v=String(v??'').trim().replace(/\s|€|%/g,''); if(v.includes(',')||/^\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isFinite(n)?n:0; };
    const inN=v=>{ const r=Math.round(v*100)/100, [e,d]=String(Math.abs(r)).split('.'); return (r<0?'-':'')+(Math.abs(r)>=1000?g3(e):e)+(d?','+d:''); };
    const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const cuota=(P,tin,n)=>{ if(P<=0||n<=0) return 0; const i=tin/100/12; return i?P*i/(1-Math.pow(1+i,-n)):P/n; };
    const capital=(c,tin,n)=>{ if(c<=0||n<=0) return 0; const i=tin/100/12; return i?c*(1-Math.pow(1+i,-n))/i:c*n; };
    let tab='vivienda'; const val={};
    const nivel=(x,ok,lim)=>x<=ok?'ok':x<=lim?'aviso':'mal';
    const sem={ok:'Cómodo',aviso:'Al límite',mal:'Demasiado'};

    function campos(cap,liq){ return {
      vivienda:[['ingreso','Ingresos netos al mes',cap.ingreso,'€','Tu media real. Suma la de tu pareja si compráis juntos.'],
        ['ahorro','Ahorro para la compra',liq,'€','Lo que tienes hoy en cuentas (sin la cartera).'],
        ['precio','Precio de la vivienda',150000,'€'],['tin','Interés (TIN fijo)',3,'%'],['anos','Plazo',30,'años'],
        ['fin','Financiación del banco',80,'%','Lo normal es el 80 % del precio.'],['gastos','Impuestos y gastos de compra',10,'%','ITP o IVA, notaría, registro… entre 8 y 12 % según la comunidad.'],
        ['otras','Otras cuotas al mes',cap.cuotas_deudas,'€','Tus préstamos actuales.']],
      coche:[['ingreso','Ingresos netos al mes',cap.ingreso,'€'],['precio','Precio del coche',15000,'€'],['entrada','Entrada',3000,'€'],
        ['tin','Interés (TIN)',7.5,'%'],['meses','Plazo',60,'meses'],['seguro','Seguro al mes',45,'€'],
        ['gasolina','Gasolina al mes',cap.gasolina_media||100,'€','Tu media real de gasolina.'],['mant','Mantenimiento al mes',40,'€','Revisiones, ruedas, ITV…'],
        ['otras','Otras cuotas al mes',cap.cuotas_deudas,'€']],
      prestamo:[['ingreso','Ingresos netos al mes',cap.ingreso,'€'],['importe','Importe',3000,'€'],['tin','Interés (TIN)',8,'%'],['meses','Plazo',24,'meses'],
        ['otras','Otras cuotas al mes',cap.cuotas_deudas,'€']]}; }

    function render(D){
      const it=D.inteligencia||{}, cap=it.capacidad||{ingreso:(D.nomina||{}).ingreso||0,cuotas_deudas:0,ahorro_mensual:0};
      const liq=(D.patrimonio||{}).liquidez||0, cs=campos(cap,liq);
      for(const t in cs){ val[t]=val[t]||{}; cs[t].forEach(([k,,d])=>{ if(val[t][k]==null) val[t][k]=Math.round((d||0)*100)/100; }); }
      const tabs=[['vivienda','Vivienda'],['coche','Coche'],['prestamo','Préstamo']];
      return `<div class="cx" id="cx">
        <div class="cx-tabs" role="tablist">${tabs.map(([k,t])=>`<button type="button" role="tab" data-cxt="${k}" aria-selected="${tab===k}">${t}</button>`).join('')}</div>
        <div class="cx-grid"><form class="cx-form" onsubmit="return false">${cs[tab].map(([k,l,,u,h])=>`<label class="cx-campo"><span>${l}</span>
          <span class="cx-in"><input data-cx="${k}" inputmode="decimal" value="${inN(val[tab][k])}"><i>${u}</i></span>${h?`<small>${h}</small>`:''}</label>`).join('')}</form>
        <div class="cx-res" id="cx-res" aria-live="polite"></div></div>
        <p class="cx-nota">Cálculo orientativo con las reglas habituales de los bancos en España (cuota de préstamos ≤ 35 % de tus ingresos, financiación del 80 % en vivienda). No es asesoramiento financiero: antes de firmar, pide al banco la oferta vinculante (FEIN) con la TAE.</p></div>`;
    }

    function calcular(D){
      const v=val[tab], it=D.inteligencia||{}, cap=it.capacidad||{}, ahM=cap.ahorro_mensual, out=[];
      const fila=(t,x,cls)=>`<div class="cx-fila"><span>${t}</span><b class="${cls||''}">${x}</b></div>`;
      const pill=(n,t)=>`<span class="cx-pill ${n}">${t||sem[n]}</span>`;
      const tiempo=falta=>{ if(falta<=0) return ''; if(!(ahM>0)) return `<p class="cx-txt mal">Te faltan ${euro(falta)}. Con tu ritmo actual (${ahM!=null?euro(ahM)+'/mes de media':'sin ahorro'}) no llegarías: antes tendrías que gastar menos de lo que ingresas.</p>`;
        const m=Math.ceil(falta/ahM); return `<p class="cx-txt">Te faltan ${euro(falta)}. Ahorrando como ahora (${euro(ahM)}/mes) los tendrías en <b>${m<24?m+' meses':(m/12).toFixed(1).replace('.',',')+' años'}</b>.</p>`; };
      let html='', grafica=null;
      if(tab==='vivienda'){
        const P=v.precio*v.fin/100, n=v.anos*12, c=cuota(P,v.tin,n), entrada=v.precio-P, gastos=v.precio*v.gastos/100, necesita=entrada+gastos;
        const esf=v.ingreso?(c+v.otras)/v.ingreso:Infinity, niv=nivel(esf,0.30,0.35), intereses=c*n-P;
        const cMax=Math.max(0,0.35*v.ingreso-v.otras), porIngresos=capital(cMax,v.tin,n)/(v.fin/100), porAhorro=v.ahorro/(1-v.fin/100+v.gastos/100), maxP=Math.min(porIngresos,porAhorro);
        html=`<div class="cx-cabeza"><span>Cuota al mes</span><div class="cx-big">${euro(c)}</div>${pill(niv)} <span class="cx-sub">${pc(esf)} de tus ingresos con tus otras cuotas</span></div>
          ${fila('Hipoteca ('+v.fin+' %)',euro(P))}${fila('Entrada que pones tú',euro(entrada))}${fila('Impuestos y gastos',euro(gastos))}
          ${fila('Ahorro necesario',euro(necesita),necesita>v.ahorro?'mal':'ok')}${fila('Intereses en '+v.anos+' años',euro(intereses))}${fila('Pagarás en total',euro(c*n+entrada+gastos))}
          ${tiempo(necesita-v.ahorro)}
          <div class="cx-max"><span>Lo máximo que te podrías permitir hoy</span><div class="cx-big2">${euro(Math.max(0,maxP))}</div>
            <span class="cx-sub">Por tus ingresos (cuota ≤ 35 %): ${euro(porIngresos)} · por tu ahorro: ${euro(porAhorro)}. Te limita ${porAhorro<porIngresos?'<b>el ahorro</b> (entrada + gastos)':'<b>el sueldo</b>'}.</span></div>`;
        // capital pendiente e intereses pagados, año a año
        const et=[], pend=[], intAc=[]; let saldo=P, ia=0; const i=v.tin/100/12, y0=new Date().getFullYear();
        for(let a=0;a<=Math.min(v.anos,40);a++){ et.push((y0+a)+'-01'); pend.push(Math.round(saldo)); intAc.push(Math.round(ia));
          for(let m=0;m<12&&saldo>0.01;m++){ const int=saldo*i; ia+=int; saldo=Math.max(0,saldo-(c-int)); } }
        grafica={inicial:Math.min(10,et.length-1),etiquetas:et,series:[{nombre:'Te queda por pagar',color:'var(--c1)',area:true,valores:pend},{nombre:'Intereses pagados',color:'var(--c2)',valores:intAc}]};
      } else if(tab==='coche'){
        const P=Math.max(0,v.precio-v.entrada), c=cuota(P,v.tin,v.meses), uso=v.seguro+v.gasolina+v.mant, total=c+uso;
        const pCuota=v.ingreso?(c+v.otras)/v.ingreso:Infinity, pTotal=v.ingreso?total/v.ingreso:Infinity;
        const recPorCuota=capital(Math.max(0,0.10*v.ingreso),v.tin,v.meses)+v.entrada, recAnual=0.35*v.ingreso*12, rec=Math.min(recPorCuota,recAnual);
        html=`<div class="cx-cabeza"><span>Cuota al mes</span><div class="cx-big">${euro(c)}</div>${pill(nivel(v.ingreso?c/v.ingreso:1,0.10,0.15))} <span class="cx-sub">${pc(v.ingreso?c/v.ingreso:NaN)} de tus ingresos (recomendado ≤ 10 %)</span></div>
          ${fila('Financias',euro(P))}${fila('Intereses',euro(c*v.meses-P))}${fila('Coche + intereses',euro(c*v.meses+v.entrada))}
          ${fila('Seguro + gasolina + mantenimiento',euro(uso)+'/mes')}${fila('Te cuesta al mes en total',euro(total),pTotal>0.2?'mal':'')}
          ${fila('Coche sobre tus ingresos',pc(pTotal),pTotal>0.2?'mal':pTotal>0.15?'aviso':'ok')}${fila('Todas tus cuotas sobre ingresos',pc(pCuota),pCuota>0.35?'mal':'')}
          ${v.entrada>0?tiempo(v.entrada-((D.patrimonio||{}).liquidez||0)):''}
          <div class="cx-max"><span>Precio de coche recomendado para ti</span><div class="cx-big2">hasta ${euro(Math.max(0,rec))}</div>
            <span class="cx-sub">Con cuota ≤ 10 % de tus ingresos a ${v.meses} meses y sin pasar del 35 % de tu sueldo anual. Todo el coche (cuota + uso) debería quedar por debajo del 15–20 % de lo que ingresas.</span></div>`;
      } else {
        const c=cuota(v.importe,v.tin,v.meses), esf=v.ingreso?(c+v.otras)/v.ingreso:Infinity;
        html=`<div class="cx-cabeza"><span>Cuota al mes</span><div class="cx-big">${euro(c,2)}</div>${pill(nivel(esf,0.30,0.35))} <span class="cx-sub">${pc(esf)} de tus ingresos con tus otras cuotas</span></div>
          ${fila('Intereses',euro(c*v.meses-v.importe,2))}${fila('Devolverás en total',euro(c*v.meses,2))}
          ${fila('Coste por cada 100 € pedidos',euro((c*v.meses/v.importe-1)*100,2))}
          ${ahM!=null?`<p class="cx-txt">${ahM>0?`Ahorrando ${euro(ahM)}/mes como ahora, en vez de pedirlo podrías reunir ${euro(v.importe)} en ${Math.ceil(v.importe/ahM)} meses y no pagar intereses.`:`Ahora gastas más de lo que ingresas (${euro(ahM)}/mes de media): una cuota más lo complicaría.`}</p>`:''}`;
      }
      return {html,grafica};
    }

    function bind(root,D,dibujar){
      const pintarRes=()=>{ const r=calcular(D), res=root.querySelector('#cx-res'); res.innerHTML=r.html+(r.grafica?'<div class="cx-graf" id="cx-graf-w"></div>':'');
        if(r.grafica&&dibujar) dibujar(res.querySelector('#cx-graf-w'),r.grafica); };
      root.querySelectorAll('[data-cxt]').forEach(b=>b.onclick=()=>{ tab=b.dataset.cxt; const cx=root.querySelector('#cx'); const nuevo=document.createElement('div'); nuevo.innerHTML=render(D); cx.replaceWith(nuevo.firstElementChild); bind(root,D,dibujar); });
      root.querySelectorAll('[data-cx]').forEach(inp=>inp.oninput=()=>{ val[tab][inp.dataset.cx]=num(inp.value); pintarRes(); });
      pintarRes();
    }
    return {render,bind};
  })();

  // ================= LO QUE EL PROGRAMA APRENDE DE TUS EXTRACTOS =================
  const IA=(()=>{
    const g3=n=>n.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const euro=v=>{ if(v==null||!isFinite(v)) return '—'; const s=Math.abs(Math.round(v)).toString(); return (v<0?'−':'')+g3(s)+' €'; };
    const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const ML=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const I=D=>D.inteligencia||null;
    function prevision(D){
      const it=I(D); if(!it) return '<p class="ia-vacio">Necesito al menos 3 meses con todos tus bancos para aprender tus gastos.</p>';
      const p=it.prevision, pres=(D.mes||{}).presupuesto||0, mes=ML[new Date().getMonth()];
      const tope=Math.max(p.maximo||0,pres,p.prevision||0)*1.08||1, pos=v=>Math.max(0,Math.min(100,v/tope*100));
      const dif=pres?p.prevision-pres:null;
      return `<div class="ia-prev">
        <div class="ia-top"><span class="ia-eyebrow">Previsión de ${mes}</span>
          <div class="ia-cifra">≈ ${euro(p.prevision)}${dif!=null?` <span class="ia-pill ${dif>0?'mal':'ok'}">${dif>0?euro(dif)+' por encima':euro(-dif)+' por debajo'} del presupuesto</span>`:''}</div></div>
        <div class="ia-rango" role="img" aria-label="Previsión entre ${euro(p.minimo)} y ${euro(p.maximo)}"><i style="left:${pos(p.minimo)}%;width:${Math.max(1,pos(p.maximo)-pos(p.minimo))}%"></i><b style="left:${pos(p.prevision)}%"></b>${pres?`<s style="left:${pos(pres)}%" title="Presupuesto"></s>`:''}</div>
        <div class="ia-escala"><span>Llevas ${euro(p.gastado)}</span>${pres?`<span>Presupuesto ${euro(pres)}</span>`:''}</div>
        <p class="ia-txt">Día ${p.dia}: llevas ${euro(p.gastado)}. Lo que sueles gastar de aquí a fin de mes (según tus últimos ${p.meses_base} meses) lo deja en <b>≈ ${euro(p.prevision)}</b>, entre ${euro(p.minimo)} y ${euro(p.maximo)}. Tu media mensual es ${euro(p.media)}.</p></div>`;
    }
    function avisos(D,max){
      const it=I(D); if(!it) return ''; const a=(it.avisos||[]).slice(0,max||6);
      return a.length?a.map(x=>`<div class="ia-aviso ${x.nivel}"><span>${escH(x.texto)}</span></div>`).join(''):'<p class="ia-vacio">Todo en orden: tus gastos van como siempre.</p>';
    }
    function categorias(D){
      const it=I(D); if(!it) return '';
      const cs=(it.categorias||[]).filter(c=>c.media>=5||c.actual>=5).slice(0,10), tope=Math.max(1,...cs.map(c=>Math.max(c.media,c.actual)));
      return cs.map(c=>`<div class="ia-cat"><span>${escH(c.categoria)}</span><span class="ia-num">${euro(c.actual)} <span class="ia-muted">/ media ${euro(c.media)}</span></span>
        <div class="ia-barra"><i class="${c.actual>c.media&&c.media>0?'mal':''}" style="width:${(c.actual/tope*100).toFixed(1)}%"></i><s style="left:${(c.media/tope*100).toFixed(1)}%" title="Tu media"></s></div></div>`).join('');
    }
    function grupos(D){
      const it=I(D); if(!it) return '';
      return `<div class="ia-tabla">${(it.grupos||[]).map(g=>{ const d=(g.real||0)-(g.presupuesto||0), mal=g.presupuesto&&g.real>g.presupuesto*1.1;
        return `<div class="ia-fila"><span>${escH(g.grupo)}</span><span class="ia-num">${g.presupuesto?euro(g.presupuesto):'—'}</span><span class="ia-num ${mal?'ia-mal':''}">${euro(g.real)}</span><span class="ia-num ${mal?'ia-mal':'ia-muted'}">${g.presupuesto?(d>0?'+':'')+euro(d):''}</span></div>`; }).join('')}</div>`;
    }
    // barras de los 12 meses del año (para GX)
    function estacion(D){
      const it=I(D); if(!it) return null; const e=it.estacionalidad||[], y=new Date().getFullYear(), ahora=new Date().getMonth();
      const media=e.filter(x=>x.n).reduce((a,x)=>a+x.media,0)/Math.max(1,e.filter(x=>x.n).length);
      return {tipo:'barras',alto:200,sinRangos:true,ultimoEsHoy:false,inicial:ahora,etiquetas:e.map(x=>y+'-'+String(x.mes).padStart(2,'0')),
        etiqueta:(ym,largo)=>{ const m=+ym.slice(5,7)-1; return largo?ML[m]+' (media de '+(e[m].n||0)+' años)':MC[m]; },
        series:[{nombre:'Gasto medio',color:'var(--c1)',valores:e.map(x=>x.n?x.media:null)}],referencia:{valor:media,nombre:'Mes normal'},
        colorBarra:(v,i)=>i===ahora?'var(--c4)':(v>media*1.15?'var(--c8)':'var(--c3)')};
    }
    return {prevision,avisos,categorias,grupos,estacion,desde:D=>I(D)&&I(D).desde,meses:D=>I(D)&&I(D).meses_fiables};
  })();

  // ---------- vistas
  function vInicio(){
    const p=D.patrimonio, m=D.mes, neto=netoVivo(), v=p.variacion_mes!=null?p.variacion_mes+(neto-p.neto):null;

    const evol=D.evolucion||[];
    const ritmo=m.dia/m.dias, w=D.semana;
    const barra=(g,lim,r)=>{ const pc=lim?Math.min(100,g/lim*100):0, cls=g>lim?'over':g>lim*r*1.1?'warn':'ok'; return `<div class="bar-wrap"><div class="bar"><i class="${cls}" style="width:${pc}%"></i></div><span class="pace" style="left:${r*100}%"></span></div>`; };
    let semana='';
    if(w){ const d=Math.min(7,Math.max(1,Math.round((Date.now()-new Date(w.desde+'T00:00:00'))/864e5)+1)), rw=d/7, q=w.limite-w.gastado;

        ${w.grupos.map(g=>`<div class="grp"><div class="grp-top"><span>${esc(g.grupo)}</span><span class="num">${eur(g.gastado,0)} <span class="muted">/ ${eur(g.limite,0)}</span></span></div>${barra(g.gastado,g.limite,rw)}</div>`).join('')}</div></section>`; }
    const grupos=m.grupos.map(g=>`<div class="grp"><div class="grp-top"><span>${esc(g.grupo)}</span><span class="num">${eur(g.mes||0,0)} ${g.presupuesto?`<span class="muted">/ ${eur(g.presupuesto,0)}</span>`:''}</span></div>${g.presupuesto?barra(g.mes||0,g.presupuesto,ritmo):''}</div>`).join('');
    const avisos=(D.avisos||[]).map(a=>`<div class="alert"><span>${esc(a)}</span></div>`).join('');
    return `<div class="hero"><span class="eyebrow">Patrimonio neto</span><div class="big num">${eur(neto,0)}</div>${chip}
      <div class="split num"><span>Invertido <b>${eur(valorCartera(),0)}</b></span><span>Liquidez <b>${eur(p.liquidez,0)}</b></span>${p.deudas?`<span>Deudas <b class="neg">${eur(-p.deudas,0)}</b></span>`:''}</div>
      </div>
      <section><div class="card">${GX.crear('m-pat',{tipo:'linea',pista:true,alto:170,etiquetas:evol.map(e=>e.mes),ocultas:['Inversiones','Liquidez'],series:[
        {nombre:'Patrimonio',color:'var(--c1)',area:true,valores:evol.map((e,i)=>i===evol.length-1?neto:e.neto)},
        {nombre:'Inversiones',color:'var(--c3)',valores:evol.map((e,i)=>i===evol.length-1?valorCartera():e.cartera)},
        {nombre:'Liquidez',color:'var(--c4)',valores:evol.map(e=>e.liquidez)},
        {nombre:'Deudas',color:'var(--c8)',valores:evol.map(e=>e.deuda==null?null:-e.deuda)}]})}</div></section>
      ${vRapidas()}
      ${semana}
      <section><h2>${mesTxt(m.mes).replace(/^\w/,c=>c.toUpperCase())}</h2><div class="card">
        <div><span class="eyebrow">Gastado</span><div class="total num">${eur(m.gastado,0)} <span class="small muted" style="font-family:var(--body);font-weight:400">de ${eur(m.presupuesto,0)}</span></div>${barra(m.gastado,m.presupuesto,ritmo)}</div>${grupos}</div></section>
      ${D.inteligencia?`<section><div class="sec-top"><h2>Lo que he aprendido</h2><button class="mini" data-ir-tab="planificar">Ver análisis</button></div><div class="card">${IA.prevision(D)}${IA.avisos(D,2)}</div></section>`:''}
      ${evol.length>1?`<section><h2>Gasto de cada mes</h2><div class="card">${GX.crear('m-gasto',{tipo:'barras',alto:160,etiquetas:evol.map(e=>e.mes),
        series:[{nombre:'Gasto',color:'var(--c1)',valores:evol.map(e=>e.gasto||0)}],referencia:m.presupuesto?{valor:m.presupuesto,nombre:'Presupuesto'}:null,
        colorBarra:(v,i)=>i===evol.length-1?'var(--c1)':(m.presupuesto&&v>m.presupuesto?'var(--c8)':'var(--c3)')})}</div></section>`:''}
      ${avisos?`<section><h2>Avisos</h2><div class="card">${avisos}</div></section>`:''}`;
  }
  function vRapidas(){
    return `<section><div class="rapidas"><button data-acc="importar" class="ancha"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg></span><b>Importar extracto<span>CSV o Excel de tu banco o bróker</span></b></button>

  let subPlan='analisis';
  function vPlanificar(){
    const seg=`<div class="cx-tabs" role="tablist" style="margin-top:12px">${[['analisis','Análisis'],['calc','¿Me lo puedo permitir?']].map(([k,t])=>`<button type="button" data-sub="${k}" aria-selected="${subPlan===k}">${t}</button>`).join('')}</div>`;

  document.addEventListener('click',e=>{ const b=e.target.closest('[data-sub]'); if(b){ subPlan=b.dataset.sub; pintar(); scrollTo(0,0); }
    const ir=e.target.closest('[data-ir-tab]'); if(ir){ pestana=ir.dataset.irTab; subPlan='analisis'; pintar(); scrollTo(0,0); } });
  function vCartera(){
    const c=D.cartera, P=c.posiciones||[], v=D.vivo, vr=vivo();
    if(!P.length) return `<h1>Cartera</h1><p class="muted">Aún no hay inversiones.</p>`;
    const filas=P.map(p=>{ const x=v&&v.precios&&v.precios[p.isin]; return Object.assign({},p,{pv:x?x.precio:p.precio, vv:x?x.valor:p.valor, hoy:x&&vr?x.cambio:null}); }).sort((a,b)=>b.vv-a.vv);
    const total=filas.reduce((a,f)=>a+f.vv,0), coste=filas.reduce((a,f)=>a+(f.coste||0),0), hoy=vr?vr.cambio_dia:null;
    const porTipo={}; filas.forEach(f=>porTipo[f.tipo]=(porTipo[f.tipo]||0)+f.vv);
    const partes=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
    return `<h1>Cartera</h1>
      <div class="kpis" style="margin-top:12px">
        <div class="kpi"><span class="eyebrow">Valor</span><span class="v num">${eur(total,0)}</span><span class="small ${hoy==null||Math.abs(hoy)<0.5?'muted':hoy<0?'neg':'pos'}">${hoy==null?'':Math.abs(hoy)<0.5?'Sin cambios hoy':(hoy>0?'+':'')+eur(hoy,0)+' hoy'}</span></div>
        <div class="kpi"><span class="eyebrow">Plusvalía</span><span class="v num ${total-coste<0?'neg':'pos'}">${total-coste>0?'+':''}${eur(total-coste,0)}</span><span class="small muted">${pct(coste?(total-coste)/coste:0,1)}</span></div>
        <div class="kpi"><span class="eyebrow">Rentab. anual</span><span class="v num">${pct(c.tir)}</span><span class="small muted">${c.tir_indice!=null?'Índice: '+pct(c.tir_indice):''}</span></div>
        <div class="kpi"><span class="eyebrow">Dividendos</span><span class="v num">${eur(filas.reduce((a,f)=>a+(f.dividendos||0),0),0)}</span><span class="small muted">cobrados</span></div></div>
      ${(D.evolucion||[]).length>1?`<section><h2>Evolución</h2><div class="card">${GX.crear('m-cart',{tipo:'linea',alto:170,etiquetas:D.evolucion.map(e=>e.mes),series:[
        {nombre:'Valor',color:'var(--c1)',area:true,valores:D.evolucion.map((e,i)=>i===D.evolucion.length-1?total:e.cartera)},
        {nombre:'Invertido',color:'var(--c2)',discontinua:true,valores:D.evolucion.map(e=>e.coste)}]})}</div></section>`:''}
      <section><h2>Por tipo de activo</h2><div class="card"><div class="stack">${partes.map(([n,x],k)=>`<span style="width:${(x/total*100).toFixed(2)}%;background:${SERIE[k%8]}"></span>`).join('')}</div>
        ${partes.map(([n,x],k)=>`<div class="lg"><span class="dot" style="background:${SERIE[k%8]}"></span><span>${esc(n)}</span><span class="num">${eur(x,0)} <span class="muted small">${pct(x/total,0)}</span></span></div>`).join('')}</div></section>
      <section><h2>Posiciones</h2><div class="card">${filas.map(f=>`<div class="pos-f"><span class="n">${esc(f.nombre)}</span><span class="num"><b>${eur(f.vv,0)}</b></span>
        <span class="s">${esc(f.tipo)} · ${esc(f.exposicion)}</span><span class="s num"><span class="${f.hoy==null?'':f.hoy<0?'neg':'pos'}">${f.hoy==null?'':(f.hoy>0?'+':'')+pct(f.hoy,2)+' hoy'}</span></span>
        <span class="s num">${eur(f.pv,2)} · ${pct(total?f.vv/total:0,1)} de la cartera</span><span class="s num ${f.vv-f.coste<0?'neg':'pos'}">${f.vv-f.coste>0?'+':''}${eur(f.vv-f.coste,0)}</span></div>`).join('')}</div></section>
      <section><h2>Cartera objetivo</h2><div class="card">${c.bloques.filter(b=>b.valor>0||b.objetivo>0).map(b=>`<div class="grp"><div class="grp-top"><span>${esc(b.bloque)}</span><span class="num">${pct(b.peso,1)} <span class="muted small">obj. ${pct(b.objetivo,0)}</span></span></div><div class="bar-wrap"><div class="bar"><i class="info" style="width:${Math.min(100,b.peso*100)}%"></i></div><span class="pace" style="left:${Math.min(100,b.objetivo*100)}%"></span></div></div>`).join('')}
        ${c.bloques.some(b=>b.proxima>0.5)?`<div class="small muted">Próxima aportación de ${eur(c.aportacion_prevista,0)}: ${c.bloques.filter(b=>b.proxima>0.5).map(b=>esc(b.bloque)+' '+eur(b.proxima,0)).join(' · ')}</div>`:''}</div></section>`;
  }
  function vObjetivos(){
    const o=(D.objetivos||[]).map(o=>{ const f=o.pct?(x=>pct(x)):(x=>eur(x,0)), w=Math.round((o.progreso||0)*100), bc={ok:'ok',camino:'ok',aviso:'warn',mal:'over',curso:'info'}[o.nivel]||'info';
      const pie=o.nivel!=='ok'&&o.logro?'Lo alcanzas hacia '+mesTxt(o.logro):'';

    const n=D.nomina, fn=(l,a,b,g)=>{ const d=g?a-b:b-a; return `<tr><td>${l}</td><td>${eur(a,0)}</td><td class="${d<-0.5?'neg':''}">${eur(b,0)}</td></tr>`; };
    return `<h1>Objetivos</h1><section style="padding-top:12px"><div class="card">${o||'<span class="muted">Sin objetivos.</span>'}</div></section>
      <section><h2>Tu dinero cada mes</h2><div class="card"><table class="tbl"><thead><tr><th></th><th>Plan</th><th>Real</th></tr></thead><tbody>
        <tr><td>Ingreso</td><td>${eur(n.ingreso,0)}</td><td>${eur(n.real.ingreso??n.ingreso,0)}</td></tr>${fn('− Fijos',n.plan.fijos,n.real.fijos,true)}${fn('− Resto del gasto',n.plan.resto,n.real.resto,true)}${fn('− Inversión',n.plan.inversion,n.real.inversion,false)}
        <tr class="t"><td>= Te sobra</td><td>${eur(n.plan.ahorro,0)}</td><td class="${n.real.ahorro<0?'neg':'pos'}">${eur(n.real.ahorro,0)}</td></tr></tbody></table><span class="small muted">Real = media de los 3 últimos meses completos.</span></div></section>`;
  }
  function vCuentas(){
    const editables=(D.editable&&D.editable.cuentas)||[];
    const cu=D.cuentas.map(x=>{ let s=x.saldo; if(x.nombre.startsWith('Trade Republic · cartera')) s=valorCartera();
      const ed=editables.includes(x.nombre), esp=enEspera(p=>p.tipo==='saldo'&&p.cuenta===x.nombre);
      return `<div class="row"><span>${esc(x.nombre)}${x.dato&&x.dato!=='hoy'?` <span class="small muted">· ${fecha(x.dato)}</span>`:''}
        ${esp?`<div><span class="pill esp">Nuevo saldo: ${eur(esp.saldo)}</span></div>`:''}</span><span class="r ${s<0?'neg':''}">${eur(s)}${ed&&!esp?`<button class="lapiz" data-acc="saldo" data-cuenta="${esc(x.nombre)}" aria-label="Anotar saldo de ${esc(x.nombre)}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button>`:''}</span></div>`; }).join('');
    const fij=(D.fijos||[]).map(f=>{ const e=f.estado||''; return `<div class="row"><span>${esc(f.concepto)} <span class="small muted">· ${esc(f.cuenta)}</span>${e?`<div class="small ${e.startsWith('✅')?'pos':e.startsWith('⚠')?'neg':'muted'}">${esc(e.replace(/^\S+\s/,''))}</div>`:''}</span><span class="r">${eur(f.importe,2)}</span></div>`; }).join('');
    const prev=(D.previstos||[]).map((x,k)=>{ const esp=enEspera(p=>p.tipo==='previsto_pagado'&&p.i===x.i&&p.concepto===x.concepto);
      return `<div class="row"><span>${esc(x.concepto)} <span class="small muted">· ${x.fecha?fecha(x.fecha):'sin fecha'}</span>
        <div class="acciones">${esp?'<span class="pill esp">Pagado · pendiente de aplicar</span>':`<button class="mini" data-acc="previsto_pagado" data-k="${k}">Ya lo he pagado</button>`}</div></span><span class="r">${eur(x.importe,0)}</span></div>`; }).join('')
      +pend.filter(p=>p.datos.tipo==='nuevo_previsto').map(p=>`<div class="row"><span>${esc(p.datos.concepto)} <div><span class="pill esp">Nuevo · pendiente de aplicar</span></div></span><span class="r">${eur(p.datos.importe,0)}</span></div>`).join('');
    const ed=D.editable||{};
    const deb=(D.te_deben||[]).map((x,k)=>{ const esp=enEspera(p=>(['cobrado','pago_parcial'].includes(p.tipo)&&p.i===x.i&&p.persona===x.persona)||(p.tipo==='compensar'&&p.persona===x.persona));
      return `<div class="row"><span>${esc(x.persona)} <span class="small muted">· ${esc(String(x.concepto).split(' (')[0])}${x.proximo?` · +${eur(x.proximo,2)} este mes`:''}</span>
        <div class="acciones">${esp?`<span class="pill esp">${esp.tipo==='cobrado'?'Pagado':esp.tipo==='compensar'?'Compensado '+eur(esp.importe,2)+' con '+esc(esp.fijo):'Pago de '+eur(esp.cantidad,2)} · pendiente de aplicar</span>`
          :`<button class="mini" data-acc="cobrado" data-k="${k}">Me ha pagado</button><button class="mini sec" data-acc="pago_parcial" data-k="${k}">Pago parcial</button>${(ed.fijos||[]).length?`<button class="mini sec" data-acc="compensar" data-persona="${esc(x.persona)}">Compensar</button>`:''}`}</div></span><span class="r pos">${eur(x.importe,2)}</span></div>`; }).join('')
      +pend.filter(p=>p.datos.tipo==='nuevo_deben').map(p=>`<div class="row"><span>${esc(p.datos.persona)} <div><span class="pill esp">Nuevo · pendiente de aplicar</span></div></span><span class="r pos">${eur(p.datos.importe,2)}</span></div>`).join('');
    const deu=(D.deudas||[]).map(x=>`<div class="row"><span>${esc(x.nombre)} <span class="small muted">· ${x.restantes} cuotas</span></span><span class="r neg">${eur(x.pendiente,2)}</span></div>`).join('');
    return `<h1>Cuentas</h1>
      <section style="padding-top:12px"><h2>Dónde está tu dinero</h2><div class="card">${cu}<div class="row"><b>Patrimonio neto</b><b class="r">${eur(netoVivo())}</b></div></div></section>

        ${(ed.compensaciones||[]).map((c,k)=>{ const esp=enEspera(p=>p.tipo==='borrar_compensacion'&&p.fecha===c.fecha&&p.fijo===c.fijo&&p.persona===c.persona);
          return `<div class="row"><span>${esc(c.persona)} → ${esc(c.fijo)} <div class="small muted">Compensado el ${fecha(c.fecha)}: ${esc(c.fijo)} te cuesta ${eur(c.importe,2)} menos este mes</div>
            <div class="acciones">${esp?'<span class="pill esp">Deshacer · pendiente de aplicar</span>':`<button class="mini sec" data-acc="borrar_compensacion" data-k="${k}">Deshacer</button>`}</div></span><span class="r">${eur(c.importe,2)}</span></div>`; }).join('')}</div></section>
      <section><div class="sec-top"><h2>Gastos previstos</h2><button class="mini" data-acc="nuevo_previsto">+ Añadir</button></div><div class="card">${prev||'<span class="muted small">No tienes gastos previstos.</span>'}</div></section>
      ${deu?`<section><h2>Deudas</h2><div class="card">${deu}</div></section>`:''}
      ${fij?`<section><h2>Gastos fijos</h2><div class="card">${fij}</div></section>`:''}
