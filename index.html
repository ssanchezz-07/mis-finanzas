  // ================= CAMBIOS HECHOS EN EL MÓVIL =================
  // Se cifran con la misma clave y se dejan en el servidor; el programa del ordenador los recoge, los aplica
  // y devuelve el resumen con su «uid» en «aplicados». Mientras tanto se ven como «pendiente de aplicar».
  let pend=[];
  const kPend=()=>'mf_pend_'+codigo;
  function cargarPend(){ try{ pend=JSON.parse(ls.get(kPend())||'[]'); }catch(e){ pend=[]; } }
  function guardarPend(){ ls.set(kPend(),JSON.stringify(pend)); }
  const enEspera=f=>{ const p=pend.find(p=>f(p.datos)); return p?p.datos:null; };
  async function cifrar(raw,obj){
    const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']), iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));
    const b=new Uint8Array(12+ct.length); b.set(iv); b.set(ct,12); return b64a(b);
  }
  async function enviarPend(){
    for(const p of pend.filter(p=>!p.enviado)){
      try{ const r=await fetch(SERVIDOR+'/rest/v1/rpc/enviar_cambio',{method:'POST',headers:{'apikey':PUBLICA,'Content-Type':'application/json'},
          body:JSON.stringify({p_id:codigo,p_datos:await cifrar(clave,p.datos)})});
        if(!r.ok) throw new Error(r.status===400?'grande':'HTTP '+r.status);
        p.enviado=true; if(p.datos.archivos) p.datos.archivos=p.datos.archivos.map(a=>({nombre:a.nombre})); guardarPend(); }
      catch(e){ break; } }
  }
  function revisarAplicados(){
    const ap=(D&&D.aplicados)||[]; let hubo=false;
    pend=pend.filter(p=>{ const a=ap.find(x=>x.uid===p.uid); if(!a) return true; hubo=true;
      aviso(a.ok?(a.mensaje||'Hecho: '+p.texto):'No se ha podido aplicar «'+p.texto+'»: '+(a.error||''),!a.ok); return false; });
    if(hubo) guardarPend();
  }
  function cambiar(datos,texto){
    const uid=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
    pend.push({uid,texto,creado:new Date().toISOString(),enviado:false,datos:Object.assign({uid},datos)}); guardarPend(); pintar();
    enviarPend().then(()=>{ pintar(); aviso(pend.find(p=>p.uid===uid&&p.enviado)?'Enviado. Se aplica en cuanto tu ordenador tenga el programa abierto.':'Sin conexión: se enviará solo en cuanto vuelva.'); });
  }
  function vEspera(){
    if(!pend.length) return '';
    return `<div class="espera"><b>${pend.length===1?'1 cambio':pend.length+' cambios'} esperando a tu ordenador</b>
      ${pend.map(p=>`<span>· ${esc(p.texto)}${p.enviado?'':' <span class="muted">(sin enviar)</span>'}</span>`).join('')}
      <span class="small muted">Se aplican solos cuando el programa esté abierto.</span>
      <button class="mini sec" data-acc="deshacer" style="justify-self:start">Anular el último</button></div>`;
  }
  let tAviso=null;
  function aviso(txt,mal){ document.querySelectorAll('.toast-m').forEach(x=>x.remove()); const a=document.createElement('div');
    a.className='toast-m'+(mal?' mal':''); a.setAttribute('role','status'); a.textContent=txt; document.body.append(a);
    clearTimeout(tAviso); tAviso=setTimeout(()=>a.remove(),mal?7000:3500); }
  function numero(v){ v=String(v||'').trim().replace(/\s|€/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isFinite(n)?n:null; }
  const hoyISO=()=>{ const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

  // hoja inferior con un formulario sencillo
  function hoja(titulo,campos,boton,alAceptar){
    document.querySelectorAll('.hoja-fondo').forEach(x=>x.remove());
    const f=document.createElement('div'); f.className='hoja-fondo';
    f.innerHTML=`<form class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="hoja-top"><h2>${esc(titulo)}</h2><button type="button" class="x" aria-label="Cerrar">✕</button></div>
      ${campos.map(c=>c.tipo==='nota'?`<p class="nota">${c.html}</p>`:c.tipo==='archivo'?`<label>${esc(c.label)}<input name="${c.id}" type="file" multiple accept=".csv,.xlsx,.xls,.txt,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>`:`<label>${esc(c.label)}${c.tipo==='select'?`<select name="${c.id}">${c.opciones.map(o=>`<option ${o===c.valor?'selected':''}>${esc(o)}</option>`).join('')}</select>`
        :`<input name="${c.id}" type="${c.tipo==='fecha'?'date':'text'}" ${c.tipo==='num'?'inputmode="decimal"':''} value="${esc(c.valor??'')}" placeholder="${esc(c.ph||'')}" autocomplete="off">`}</label>`).join('')}
      <p class="err" hidden></p><button class="btn" type="submit">${esc(boton)}</button></form>`;
    const cerrar=()=>f.remove();
    f.addEventListener('click',e=>{ if(e.target===f||e.target.closest('.x')) cerrar(); });
    f.querySelector('form').onsubmit=async e=>{ e.preventDefault(); const v={};
      campos.filter(c=>c.id).forEach(c=>{ const el=f.querySelector(`[name="${c.id}"]`); v[c.id]=c.tipo==='archivo'?el.files:el.value; });
      const bt=f.querySelector('[type=submit]'), txt=bt.textContent; bt.disabled=true; bt.textContent='Un momento…';
      const err=await alAceptar(v); bt.disabled=false; bt.textContent=txt;
      if(err){ const p=f.querySelector('.err'); p.textContent=err; p.hidden=false; } else cerrar(); };
    document.body.append(f); const i=f.querySelector('input'); if(i&&!i.value) setTimeout(()=>i.focus(),50);
  }

  function accion(b){
    const a=b.dataset.acc, k=+b.dataset.k, ed=D.editable||{};
    if(a==='deshacer'){ const p=pend[pend.length-1]; if(!p) return;
      if(p.enviado){ aviso('Ese cambio ya se envió. Si no lo quieres, deshazlo en el programa del ordenador.',true); return; }
      pend.pop(); guardarPend(); pintar(); aviso('Cambio anulado.'); return; }
    if(a==='cobrado'){ const x=D.te_deben[k];
      hoja(x.persona+' te ha pagado',[],'Sí, me ha pagado '+eur(x.importe,2),()=>{ cambiar({tipo:'cobrado',i:x.i,persona:x.persona,concepto:x.concepto},x.persona+' te ha pagado '+eur(x.importe,2)); }); return; }
    if(a==='pago_parcial'){ const x=D.te_deben[k];
      hoja('Pago parcial de '+x.persona,[{id:'c',label:'¿Cuánto te ha pagado? (€)',tipo:'num',ph:'p. ej. 20'}],'Guardar',v=>{ const c=numero(v.c);
        if(!c||c<=0) return 'Escribe cuánto te ha pagado.'; if(!x.mensual&&c>x.importe+0.005) return 'Es más de lo que te debe ('+eur(x.importe,2)+').';
        cambiar({tipo:'pago_parcial',i:x.i,persona:x.persona,concepto:x.concepto,cantidad:c},x.persona+' te ha pagado '+eur(c,2)); }); return; }
    if(a==='nuevo_deben'){
      hoja('Alguien te debe dinero',[{id:'p',label:'¿Quién?',ph:'p. ej. Sergio'},{id:'i',label:'Importe (€)',tipo:'num'},{id:'c',label:'Concepto',ph:'p. ej. Cena del sábado'}],'Añadir',v=>{
        const imp=numero(v.i); if(!v.p.trim()) return 'Escribe quién te debe el dinero.'; if(!imp||imp<=0) return 'Escribe el importe.';
        cambiar({tipo:'nuevo_deben',persona:v.p.trim(),importe:imp,concepto:v.c.trim()},v.p.trim()+' te debe '+eur(imp,2)); }); return; }
    if(a==='previsto_pagado'){ const x=D.previstos[k];
      hoja('¿Ya has pagado «'+x.concepto+'»?',[],'Sí, ya está pagado',()=>{ cambiar({tipo:'previsto_pagado',i:x.i,concepto:x.concepto},'«'+x.concepto+'» pagado'); }); return; }
    if(a==='nuevo_previsto'){
      hoja('Nuevo gasto previsto',[{id:'c',label:'Concepto',ph:'p. ej. Seguro del coche'},{id:'i',label:'Importe (€)',tipo:'num'},{id:'f',label:'Fecha (opcional)',tipo:'fecha'}],'Añadir',v=>{
        const imp=numero(v.i); if(!v.c.trim()) return 'Escribe el concepto.'; if(!imp||imp<=0) return 'Escribe el importe.';
        cambiar({tipo:'nuevo_previsto',concepto:v.c.trim(),importe:imp,fecha:v.f||null},'Gasto previsto: '+v.c.trim()+' '+eur(imp,0)); }); return; }
    if(a==='saldo'){ const cuentas=ed.cuentas||[]; if(!cuentas.length){ aviso('Abre el programa del ordenador para que envíe tu lista de cuentas.',true); return; }
      const pre=b.dataset.cuenta||cuentas[cuentas.length-1], act=(D.cuentas.find(c=>c.nombre===pre)||{}).saldo;
      hoja('Anotar saldo',[{id:'c',label:'Cuenta',tipo:'select',opciones:cuentas,valor:pre},{id:'s',label:'Saldo de hoy (€)',tipo:'num',ph:act!=null?'Ahora: '+eur(act,2):''}],'Guardar',v=>{
        const s=numero(v.s); if(s==null) return 'Escribe el saldo.';
        cambiar({tipo:'saldo',cuenta:v.c,saldo:s},'Saldo de '+v.c+': '+eur(s,2)); }); return; }
    if(a==='compensar'){ const per=b.dataset.persona, filasP=(D.te_deben||[]).filter(x=>x.persona===per), prox=filasP.reduce((t,x)=>t+(x.proximo||0),0), debe=filasP.reduce((t,x)=>t+x.importe,0)+prox;
      const fijos=(ed.fijos||[]).filter(f=>f.libre>0.005); if(!fijos.length){ aviso('Este mes ya has compensado todos tus gastos fijos.',true); return; }
      const sug=fijos.find(f=>/padre|madre|famil/i.test(f.concepto))||fijos[0], r2=v=>Math.round(v*100)/100;
      const nota=(fj,c)=>{ const f=fijos.find(x=>x.concepto===fj); if(!f||!c) return ''; if(c>debe+0.005) return per+' solo te debe '+eur(debe,2)+'.'; if(c>f.libre+0.005) return 'Como mucho puedes compensar '+eur(f.libre,2)+' de «'+f.concepto+'».';
        return 'Este mes transfieres '+eur(f.libre-c,2)+' en vez de '+eur(f.libre,2)+' a «'+f.concepto+'»'+(c>=debe-0.005?' y '+per+' queda saldado/a.':' y '+per+' aún te deberá '+eur(debe-c,2)+'.'); };
      hoja('Compensar lo que te debe '+per,[{tipo:'nota',html:'Te debe <b>'+eur(debe-prox,2)+'</b>'+(prox?' y este mes se le cobrarán <b>'+eur(prox,2)+'</b> más (total '+eur(debe,2)+')':'')+'. Si le pagas algo tú cada mes, le transfieres solo la diferencia y su deuda queda saldada. En tu gasto sigue contando el pago completo.'},
        {id:'f',label:'¿Con qué pago tuyo?',tipo:'select',opciones:fijos.map(f=>f.concepto),valor:sug.concepto},
        {id:'i',label:'Importe a compensar (€)',tipo:'num',valor:String(r2(Math.min(debe,sug.libre))).replace('.',',')},{tipo:'nota',html:'<span id="comp-nota"></span>'}],'Compensar',v=>{
        const c=numero(v.i), f=fijos.find(x=>x.concepto===v.f); if(!c||c<=0) return 'Escribe el importe.'; if(c>debe+0.005) return per+' solo te debe '+eur(debe,2)+'.';
        if(c>f.libre+0.005) return 'Como mucho puedes compensar '+eur(f.libre,2)+' de «'+f.concepto+'» este mes.';
        cambiar({tipo:'compensar',persona:per,fijo:v.f,importe:r2(c),fecha:hoyISO()},'Compensar '+eur(c,2)+' de '+per+' con «'+v.f+'»'); });
      const sel=document.querySelector('form.hoja select'), inp=document.querySelector('form.hoja [name=i]'), n=document.getElementById('comp-nota');
      const act=()=>{ n.textContent=nota(sel.value,numero(inp.value)); };
      sel.onchange=()=>{ const f=fijos.find(x=>x.concepto===sel.value); inp.value=String(r2(Math.min(debe,f.libre))).replace('.',','); act(); }; inp.oninput=act; act(); return; }
    if(a==='borrar_compensacion'){ const c=ed.compensaciones[k];
      hoja('¿Deshacer la compensación?',[{tipo:'nota',html:esc(c.persona)+' volverá a deberte '+eur(c.importe,2)+' y «'+esc(c.fijo)+'» vuelve a su importe normal.'}],'Sí, deshacer',()=>{
        cambiar({tipo:'borrar_compensacion',fecha:c.fecha,fijo:c.fijo,persona:c.persona},'Deshacer compensación de '+c.persona); }); return; }
    if(a==='importar'){ const bancos=ed.bancos||[]; if(!bancos.length){ aviso('Abre el programa del ordenador para que envíe tu lista de bancos.',true); return; }
      hoja('Importar extracto',[{tipo:'nota',html:'Descarga los movimientos en la app de tu banco, guárdalos en <b>Archivos</b> y elígelos aquí. Tu ordenador los importa en cuanto el programa esté abierto.'},
        {id:'b',label:'¿De qué banco?',tipo:'select',opciones:bancos,valor:bancos[0]},{id:'f',label:'Archivo(s)',tipo:'archivo'}],'Enviar al ordenador',async v=>{
        const fs=[...(v.f||[])]; if(!fs.length) return 'Elige el archivo del extracto.';
        if(fs.some(f=>!/\.(csv|xlsx|xls|txt)$/i.test(f.name))) return 'Solo se pueden importar archivos CSV o Excel.';
        if(fs.reduce((t,f)=>t+f.size,0)>4e6) return 'Los archivos ocupan demasiado (máximo 4 MB en total).';
        const leer=f=>new Promise((ok,mal)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=mal; r.readAsDataURL(f); });
        let archivos; try{ archivos=await Promise.all(fs.map(async f=>({nombre:f.name,b64:await leer(f)}))); }catch(e){ return 'No se ha podido leer el archivo.'; }
        cambiar({tipo:'importar',banco:v.b,archivos},'Importar '+(fs.length===1?'«'+fs[0].name+'»':fs.length+' archivos')+' en '+v.b); }); return; }
    if(a==='gasto'){ const cats=ed.categorias||[], def=['Supermercado','Restaurantes y bares','Compras varias'].find(c=>cats.includes(c))||cats[0];
      hoja('Gasto en efectivo',[{id:'i',label:'Importe (€)',tipo:'num',ph:'p. ej. 4,50'},{id:'c',label:'¿En qué?',ph:'p. ej. Café'},{id:'k',label:'Categoría',tipo:'select',opciones:cats,valor:def},{id:'f',label:'Fecha',tipo:'fecha',valor:hoyISO()}],'Apuntar gasto',v=>{
        const imp=numero(v.i); if(!imp||imp<=0) return 'Escribe el importe.'; if(!v.c.trim()) return 'Escribe en qué te lo has gastado.'; if(!v.f) return 'Indica la fecha.';
        cambiar({tipo:'gasto',fecha:v.f,concepto:v.c.trim(),importe:imp,categoria:v.k},'Gasto: '+v.c.trim()+' '+eur(imp,2)); }); return; }
  }
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-acc]'); if(b&&D) accion(b); });

  document.addEventListener('click',e=>{ if(e.target.id==='salir'){ ls.del('mf_clave_'+codigo); ls.del('mf_cache_'+codigo); clave=null; D=null; $('#tabs').hidden=true; pantallaAcceso(); } });
  setInterval(()=>{ if(D) estado(); },30000);

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('hashchange',()=>location.reload());
  arrancar();
})();
</script>
</body>
